  "/openapi/v1/paygroups":
    get:
      tags:
      - Finance
      summary: List all paygroups for the organization
      description: |-
        # **Request**
        `GET /openapi/v1/paygroups`
        This API endpoint retrieves all the paygroups within the organization.
        The request includes the following:

        ### HEADERS

        | name | **Required** | description | **Type** | **Example** | **default** | **Additional Notes** |
        | --- | --- | --- | --- | --- | --- | --- |
        | api-version | Yes | Supported API version s | Integer | 1 |  | currently supported is 1 only |
        | Slug | Yes | Organization slug name | String | abcd |  |  |
        | Access-Token | Yes | Used to allow an application to access an API it generated from Session API | String | eyJhbGciOiJIUzI1NiJ9.eyJvcmdhbml6YXRpb25faWRlbnRp<br>ZmllciI6OTAwMDAxNCwiYXBpX2tleV9pZCI6MSwic291cm<br>NlIjoib3Blbl9hcGkiLCJzb3VyY2VfaWQiOm51bGwsImlhd<br>CI6MTY5OTYwMjF4NiwiZXhwIjoxNzAyMTk0Njg2fQ.upSy<br>VVcRrBe2SNUvjnAlDq7NO-N_tenPnGF6zNs1KZU |  |  |
        | source | No | the source type of Open Api | String | open_api | open_api | Supported values:  <br>\- open_api  <br>\- external_aggregator |
        | username | Conditional:  <br>if the source type: external_aggregator | the name of the external service | String | workable |  |  |

        #### Query Parameters

        | **name** | **Required** | **Description** | **Type** | **Example** | **Default** | **Additional Notes** |
        | --- | --- | --- | --- | --- | --- | --- |
        | rpp | No | Control the limit of the shown result per page | Integer | 50 | 100 | Minimum: 1 <br>Maximum: 100 |
        | page | No | Choose the required page | Integer | 5 | 1 |  |
        ---
        # Response
        - Success Response
        The success response of the API represented as the following:
        Plain Text

        ```
        {
            "success": true,
            "message": null,
            "data": {
                "paygroups": [
                    {
                        "id": "56f6e9cc-0d45-4133-b23b-aeaf2b8e6992",
                        "name": "default"
                    },
                    {
                        "id": "69360df7-1b9f-4144-9e1c-8b05f1bfc1eb",
                        "name": "Pallavi"
                    },
                    {
                        "id": "b02aadff-bfd4-4a78-979e-3115fdc05126",
                        "name": "ammar"
                    },
                    {
                        "id": "2fb72457-4d35-4ca8-b67c-e3e67dc529d3",
                        "name": "Abubker"
                    },
                    {
                        "id": "86298de6-9112-4445-b6cf-88b1a288d2c7",
                        "name": "Mohammed"
                    },
                    {
                        "id": "f6224234-2c81-4326-ad22-e46d94da8ac0",
                        "name": "Salah"
                    }
                ],
                "pagination": {
                    "current_page": 1,
                    "next_page": null,
                    "previous_page": null,
                    "total_pages": 1,
                    "per_page": 100,
                    "total_entries": 6
                }
            }
        }
         ```

        This contains the following:

        | **key** | **Description** | **value** |
        | --- | --- | --- |
        | success | Represent the status of the API response | true |
        | message | Show additional message | null |
        | data | Show the required data to fetch, and contain two values type: <br>+ paygroups: contain array of all available paygroups <br>pagination: contain additional field to navigate data through the API | hash of data |
        | Status_code | The status code of the API request | 200 |
        ---
        Pagination:
        - `current_page`: The current page of the results.
        - `next_page`: The URL of the next page of results, if available.
        - `previous_page`: The URL of the previous page of results, if available.
        - `total_pages`: The total number of pages.
        - `per_page`: The number of results per page.
        - `total_entries`: The total number of entries across all pages.
      operationId: listPaygroups
      parameters:
      - name: page
        in: query
        description: Pagination
        schema:
          type: string
      - name: rpp
        in: query
        description: Pagination (no. of records per page. Default is 100)
        schema:
          type: string
      - name: slug
        in: header
        schema:
          type: string
      - name: api-version
        in: header
        schema:
          type: string
      - name: Access-Token
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Success Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paygroups:
                        type: array
                        example:
                        - id: 56f6e9cc-0d45-4133-b23b-aeaf2b8e6992
                          name: default
                        - id: 69360df7-1b9f-4144-9e1c-8b05f1bfc1eb
                          name: Pallavi
                        - id: b02aadff-bfd4-4a78-979e-3115fdc05126
                          name: ammar
                        - id: 2fb72457-4d35-4ca8-b67c-e3e67dc529d3
                          name: Abubker
                        - id: 86298de6-9112-4445-b6cf-88b1a288d2c7
                          name: Mohammed
                        - id: f6224234-2c81-4326-ad22-e46d94da8ac0
                          name: Salah
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: number
                            example: 1
                          next_page:
                            type: object
                            nullable: true
                            example: 'null'
                          previous_page:
                            type: object
                            nullable: true
                            example: 'null'
                          total_pages:
                            type: number
                            example: 1
                          per_page:
                            type: number
                            example: 100
                          total_entries:
                            type: number
                            example: 6
                  message:
                    type: object
                    nullable: true
                    example: 'null'
                  success:
                    type: boolean
                    example: true
