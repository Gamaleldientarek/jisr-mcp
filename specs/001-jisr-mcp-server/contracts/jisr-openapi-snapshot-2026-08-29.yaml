      description: |-
        # **Request**

        `POST /openapi/v1/employees`

        This API used to create new employee on abcd system

        The request includes the following:

        ### HEADERS

        | name | **Required** | description | **Type** | **Example** | **default** | **Additional Notes** |
        | --- | --- | --- | --- | --- | --- | --- |
        | api-version | Yes | Supported API version s | Integer | 1 |  | currently supported is 1 only |
        | Slug | Yes | Organization slug name | String | abcd |  |  |
        | Access-Token | Yes | Used to allow an application to access an API it generated from Session API | String | eyJhbGciOiJIUzI1NiJ9.eyJvcmdhbml6YXRpb25faWRlbnRp<br>ZmllciI6OTAwMDAxNCwiYXBpX2tleV9pZCI6MSwic291cm<br>NlIjoib3Blbl9hcGkiLCJzb3VyY2VfaWQiOm51bGwsImlhd<br>CI6MTY5OTYwMjF4NiwiZXhwIjoxNzAyMTk0Njg2fQ.upSy<br>VVcRrBe2SNUvjnAlDq7NO-N_tenPnGF6zNs1KZU |  |  |
        | source | No | the source type of Open Api | String | open_api | open_api | Supported values:  <br>\- open_api  <br>\- external_aggregator |
        | username | Conditional:  <br>if the source type: external_aggregator | the name of the external service | String | workable |  |  |

        #### Body Parameters

        | **Name** | **Description** |
        | --- | --- |
        | code | Unique identifier assigned to each employee within an organization |
        | full_name_en | Full name of employee on English language at least contain two parts |
        | full_name_ar | Full name of employee on Arabic language at least contain two parts |
        | department_id | Department id get this value from lookups |
        | employment_type_id | Employment type id get this value from lookups |
        | location_id | Location id get this value from lookups |
        | joining_date | The date that employee join the organization |
        | email | Employee email |
        | gender | Allowed gender on abcd system (Male - Female) |
        | marital_status | Allowed marital status on abcd system (Single - Married - Divorced - Widowed) |
        | document_number | Employee Identifier number (ID - Iqama) |
        | nationality_id | Nationality id get this value from lookups |
        | contract_type | Allowed contract type on abcd system (Fixed term - Indefinite) |
        | contract_period | Allowed contract period on abcd system (1 year - 2 years - Custom) |
        | end_date | It represent the end date of the contract |

        ---

        # Response

        - Success Response

        Plain Text

        ```
        {
            "success": true,
