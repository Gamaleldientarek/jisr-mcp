  "/openapi/v1/employees":
    get:
      tags:
      - Employees
      summary: List
      description: |-
        # **Request**

        `GET /openapi/v1/employees`

        This API used to get all active employees basic info

        **Note:** If the API key has the "Get Employee Financial Info" permission, the response will include additional financial fields for each employee:
        - `basic_salary`: Employee's basic salary
        - `first_salary_pay_date`: Date of first salary payment
        - `last_salary_pay_date`: Contract end date (last salary payment date)

        These fields will be omitted if the API key does not have the required permission.

        The request includes the following:

        ### HEADERS

        | name | **Required** | description | **Type** | **Example** | **default** | **Additional Notes** |
        | --- | --- | --- | --- | --- | --- | --- |
        | api-version | Yes | Supported API version s | Integer | 1 |  | currently supported is 1 only |
        | Slug | Yes | Organization slug name | String | abcd |  |  |
        | Access-Token | Yes | Used to allow an application to access an API it generated from Session API | String | eyJhbGciOiJIUzI1NiJ9.eyJvcmdhbml6YXRpb25faWRlbnRp<br>ZmllciI6OTAwMDAxNCwiYXBpX2tleV9pZCI6MSwic291cm<br>NlIjoib3Blbl9hcGkiLCJzb3VyY2VfaWQiOm51bGwsImlhd<br>CI6MTY5OTYwMjF4NiwiZXhwIjoxNzAyMTk0Njg2fQ.upSy<br>VVcRrBe2SNUvjnAlDq7NO-N_tenPnGF6zNs1KZU |  |  |
        | source | No | the source type of Open Api | String | open_api | open_api | Supported values:  <br>\- open_api  <br>\- external_aggregator |
        | username | Conditional:  <br>if the source type: external_aggregator | the name of the external service | String | workable |  |  |

        #### Query Parameters

        | **name** | **Required** | **Description** | **Type** | **Example** | **Default** | **Additional Notes** |
        | --- | --- | --- | --- | --- | --- | --- |
        | rpp | No | control the limit of the shown result per page | Integer | 50 | 100 | Minimum: 1  <br>Maximum: 100 |
        | page | No | choose the required page | Integer | 5 | 1 |  |
        | id | Yes | Unique id of the employee | String | bab6cd98-7246-4cfc-a576-19bc00391792 |  | UUID type |
        | date | No | This filter use to get employees who created at this date and on | Date | 2023/01/01 |  |  |
        | status | No | This filter use to filter employees by there status and support two values (active - inactive) | string | active |  | must be within \[active, inactive\] |
        | terminate_date\[from\] | No | This filter use to get employees who got offboarded from specific date and on | Date | 2022/01/01 |  |  |
        | terminate_date\[to\] | No | This filter use to get employees who got offboarded until specific date | Date | 2023/12/01 |  |  |
        | delete_date\[from\] | No | This filter use to get employees who got deleted from system from specific date and on | Date | 2022/01/01 |  | |
        | delete_date\[to\] | No | This filter use to get employees who got deleted from system until specific date | Date | 2023/12/01 |  |  |
        | joining_date\[from\] | No | This filter use to get employees who joined  from specific date and on | Date | 2022/01/01 |  | |
        | joining_date\[to\] | No | This filter use to get employees who joined until specific date | Date | 2023/12/01 |  |  |

        ---

