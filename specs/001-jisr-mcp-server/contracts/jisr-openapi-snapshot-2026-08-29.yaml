        This contain the following:

        | **key** | **Description** | **value** |
        | --- | --- | --- |
        | success | represent the status of the API response | true |
        | message | show additional message | null |
        | data | show the required data to fetch, and contain two values type: <br>\+ gl_transaction_types: contain array of all available gl transaction types  <br>pagination: contain additional field to navigate data through the api | hash of data |
        | Status_code | the status code of the api request | 200 |

        GL Transaction Types description:

        - `id`: The unique identifier of a GL Transaction Type.
        - `gl_transaction_category`: The category the transaction type belongs to
        - `gl_transaction_name`: The name of The GL Transaction Type, unique within each category.
        - `gl_transaction_name_ar`: The arabic name for GL Transaction type.
        - `status`: The status of the GL Transaction Type, must be within two possibilities \[active, inactive\].

        ---

        Pagination:

        - `current_page`: The current page of the results.
        - `next_page`: The URL of the next page of results, if available.
        - `previous_page`: The URL of the previous page of results, if available.
        - `total_pages`: The total number of pages.
        - `per_page`: The number of results per page.
        - `total_entries`: The total number of entries across all pages.

        ---

        ### Error Response

        The success response of the API represented as the following:

        Plain Text

        ```
        {
            "success": false,
            "error": "error message",
            "status_code": 400
        }
         ```

        This response contain the following:

        | **name** | **Description** | **Value** |
        | --- | --- | --- |
        | success | represent the status of the API response | false |
        | error | represent the error reason acquired during the request | error_messages |
        | status_code | the status code of the api requests | error_status_code |

        error_messages

        | **message** | **Reason** |
        | --- | --- |
        | Parameter {field_name} is required | The field name is required |
        | "value" is not a valid {type} | the value passed is not in valid type |
        | invalid api version | invalid `api-version` header passed or api-version header was not passed at all |
        | Organization not found with given subdomain | invalid `Slug` header value |
        | Permission denied. Please contact your Administrator | `Slug` Header is missing or your organization doesn't support open api feature |
        | This call requires login | `Access-Token` is missing or invalid |
        | Your account has been logged out. Please, log in again | previously logged out or expired token |
        | Your account temporary suspended, please contact account manager | The organization account is suspended |
        | Bad credentials | the credentials is not suited on that organization |
        | invalid external aggregator | the aggregator name is not valid within that organization |
        | Unable to authenticate employee | api-key is not active or valid |

