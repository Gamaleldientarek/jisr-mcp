                }
            }
        }
         ```

        This contain the following:

        | **key** | **Description** | **value** |
        | --- | --- | --- |
        | success | represent the status of the API response | true |
        | message | show additional message | null |
        | data | show the required data to fetch, and contain two values type: <br>\+ leaves_summary: contain array of all employees leaves summary <br>pagination: contain additional field to navigate data through the api | hash of data |
        | Status_code | the status code of the api request | 200 |

        Leave summary description:

        - `id`: The unique identifier of the leave summary.
        - `leave_days`: The number of leave days for the employee.
        - `previous_year_balance`: The balance of leave days from the previous year.
        - `opening_balance`: The opening balance of leave days for the current year.
