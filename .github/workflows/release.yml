name: Release

# Releases originate from a version tag on the default branch and are published
# by this workflow, never from a maintainer's machine (spec FR-044a).
#
# Two stages, deliberately decoupled:
#   - GitHub Release: every version tag.
#   - npm publish: only when NPM_TOKEN is configured AND package.json has
#     dropped private:true -- both are explicit acts, so a tag alone can never
#     ship a package by accident.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run verify:coverage
      # Tag, package version, changelog entry, and the documented protocol and
      # snapshot versions must all agree before anything is released.
      - name: Verify release consistency
        run: npm run verify:release
        env:
          RELEASE_TARGET: ${{ secrets.NPM_TOKEN != '' && 'npm' || 'github' }}
      - run: npm run build

  publish-npm:
    needs: verify
    # Explicit opt-in: configuring NPM_TOKEN is the act that enables this stage.
    if: ${{ secrets.NPM_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [verify, publish-npm]
    # Runs whether npm publishing happened or was skipped -- but never after a
    # failure.
    if: ${{ always() && needs.verify.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.publish-npm.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --notes-file .github/release-template.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
