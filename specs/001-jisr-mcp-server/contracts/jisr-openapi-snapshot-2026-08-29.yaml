                    "passport_number": null,
                    "line_manager": null,
                    "is_invited": true,
                    "last_active_time": "The employee has never logged in to his account",
                    "working_experience_period": "Not joined yet",
                    "created_at": "August 30, 2023",
                    "address": null,
                    "job_title": null,
                    "business_unit": {
                        "id": "c33f90d6-85d8-4f99-baae-d6543bd96ab8",
                        "name_en": "business-unit-open-api-1",
                        "name_ar": "business-unit-open-api-1-ar"
                    },
                    "department": {
                        "id": 10467,
                        "name_en": "accountant",
                        "name_ar": "accountant"
                    },
                    "employment_type": {
                        "id": 104,
