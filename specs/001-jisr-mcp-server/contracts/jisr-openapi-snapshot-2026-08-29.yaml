---
openapi: 3.0.3
info:
  description: |-
    JISR use two type of server hosting one is on AWS and another hosted on local server.

    **How to check hostname:**
    Open jisr site on the webpage and check does the url has domain name .jisr.net.sa meaning your site hosted on local server other wise hosted on Aws.

    AWS endpoint URL ==> [https://apis.jisr.net/api](https://apis.jisr.net/api)<br>
    local endpoint URL ==> [https://api.jisr.net.sa/api/](https://api.jisr.net.sa/api/)
  title: JisrOpenApi
  version: 1.0.0
servers:
- url: https://apis.jisr.net/api
components: {}
paths:
  "/openapi/v1/accrual_transactions":
    get:
      tags:
      - Accruals
      summary: List Accrual Transactions
      description: |-
        # **Request** ### GET /openapi/v1/accrual_transactions
        This endpoint retrieves accrual transactions based on the provided parameters.
        The request includes the following:

         ### HEADERS


        | name | **Required** | description | **Type** | **Example** | **default** | **Additional Notes** |
        | --- | --- | --- | --- | --- | --- | --- |
        | api-version | Yes | Supported API version s | Integer | 1 |  | currently supported is 1 only |
        | Slug | Yes | Organization slug name | String | abcd |  |  |
        | Access-Token | Yes | Used to allow an application to access an API it generated from Session API | String | eyJhbGciOiJIUzI1NiJ9.eyJvcmdhbml6YXRpb25faWRlbnRp<br>ZmllciI6OTAwMDAxNCwiYXBpX2tleV9pZCI6MSwic291cm<br>NlIjoib3Blbl9hcGkiLCJzb3VyY2VfaWQiOm51bGwsImlhd<br>CI6MTY5OTYwMjF4NiwiZXhwIjoxNzAyMTk0Njg2fQ.upSy<br>VVcRrBe2SNUvjnAlDq7NO-N_tenPnGF6zNs1KZU |  |  |
        | source | No | the source type of Open Api | String | open_api | open_api | Supported values:  <br>\- open_api  <br>\- external_aggregator |
        | username | Conditional:  <br>if the source type: external_aggregator | the name of the external service | String | workable |  |  |
        ---
        #### Query Parameters

        | **name** | **Required** | **Description** | **Type** | **Example** | **Default** | **Additional Notes** |
        | --- | --- | --- | --- | --- | --- | --- |
        | rpp | No | control the limit of the shown result per page | Integer | 50 | 100 | Minimum: 1  <br>Maximum: 100 |
        | page | No | choose the required page | Integer | 5 | 1 |  |
        | accrual_type | Yes | Types of transactions, must be within these types: \[vacations, end_of_service, tickets_provision\] | String |  |  |
        | paygroup_id | Yes |  | string | 56f6e9cc-0d45-4133-b23b-aeaf2b8e6992 |  |  |
        | pay_period | Yes | 1st day of a confirmed month | Date | 2022-03-01 |  |  |
        | employee_ids | No | filter by employee ids | Array | \[dfa893d5-284a-4be8-800c-e2287852177a\] |  | If this param not found it'll fetch all transactions within that settlement |
        ---
        #### Request Body
        - `accrual_type` (string, optional): Type of accrual.
        - `paygroup_id` (string, required): Paygroup Id.
        - `pay_period` (string, required): Pay period filter.
        - `page` (number, optional): Page number for paginated results.
        - `rpp` (number, optional): Records per page for pagination.
        - `employee_ids` (array, optional): Array of employee IDs.

        #### Examples of Response
        1. If successful:

            ``` json
                       {
                         "success": true,
                         "message": null,
                         "data": {
                           "pay_period": "",
                           "employees": [
                             {
                               "id": "",
                               "code": "",
                               "full_name_en": "",
                               "full_name_ar": "",
                               "is_active": true,
                               "status": "",
                               "payment_type": "",
                               "payment_type_i18n": "",
                               "business_unit": null,
                               "grade": null,
                               "country": null,
                               "gosi_info": {
                                 "name_i18n": "",
                                 "gosi_number": ""
                               },
                               "accrual": {
                                 "amount": 0,
                                 "downgrade_amount": 0,
                                 "vacation_days": 0,
                                 "has_vacation_days": true
                               }
                             }
                           ],
                           "pagination": {
                             "total_pages": 0,
                             "per_page": 0,
                             "total_entries": 0
                           }
                         }
                       }

             ```
             1. If failed:

             ``` json
                       {
                          "success": false,
                          "error": "Couldn't find data with the provided period. Please make sure the provided date is the 1st day of a confirmed month",
                          "status_code": 400
                        }
             ```
      operationId: listAccrualTransactions
      parameters:
      - name: accrual_type
        in: query
        description: 'Required. Valid types are: [vacations, end_of_service, tickets_provision]'
        schema:
          type: string
      - name: paygroup_id
        in: query
        description: Required. Paygroup identifier.
        schema:
          type: string
      - name: pay_period
        in: query
        description: Required, 1st day of a confirmed month.
        schema:
          type: string
      - name: page
        in: query
        description: Pagination
        schema:
          type: string
      - name: rpp
        in: query
        description: Pagination (no. of records per page. Default is 100)
        schema:
          type: string
      - name: employee_ids[]
        in: query
        description: Filter by an array of employee_ids
        schema:
          type: string
      - name: slug
        in: header
        schema:
          type: string
      - name: api-version
        in: header
        schema:
          type: string
      - name: Access-Token
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Success Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    nullable: true
                    example: 'null'
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      pay_period:
                        type: string
                        example: 2023-01-01 - 2023-01-31
                      employees:
                        type: array
                        example:
                        - accrual:
                            amount: 27123.29
                            downgrade_amount: 0
                            has_vacation_days: false
                            vacation_days: 0
                          business_unit:
                          code: '895478215882'
                          country:
                          full_name_ar: مراد
                          full_name_en: Morad Aljibly
                          gosi_info:
                            gosi_number: '60001234'
                            name_i18n: " 1 Al-salem"
                          grade:
                          id: b07874d9-6026-4e87-a78d-db5ad71ef198
                          is_active: true
                          payment_type: Cash
                          payment_type_i18n: Cash
                          status: active
                        items:
                          type: object
                          properties:
                            accrual:
                              type: object
                              properties:
                                amount:
                                  type: number
                                  example: 27123.29
                                downgrade_amount:
                                  type: number
                                  example: 0.0
                                has_vacation_days:
                                  type: boolean
                                  example: false
                                vacation_days:
                                  type: number
                                  example: 0.0
                            business_unit:
                              type: object
                              nullable: true
                              example: 'null'
                            code:
                              type: string
                              example: '895478215882'
                            country:
                              type: object
                              nullable: true
                              example: 'null'
                            full_name_ar:
                              type: string
                              example: مراد
                            full_name_en:
                              type: string
                              example: Morad Aljibly
                            gosi_info:
                              type: object
                              properties:
                                gosi_number:
                                  type: string
                                  example: '60001234'
                                name_i18n:
                                  type: string
                                  example: " 1 Al-salem"
                            grade:
                              type: object
                              nullable: true
                              example: 'null'
                            id:
                              type: string
                              example: b07874d9-6026-4e87-a78d-db5ad71ef198
                            is_active:
                              type: boolean
                              example: true
                            payment_type:
                              type: string
                              example: Cash
                            payment_type_i18n:
                              type: string
                              example: Cash
                            status:
                              type: string
                              example: active
                      pagination:
                        type: object
                        properties:
                          per_page:
                            type: number
                            example: 10.0
                          total_entries:
                            type: number
                            example: 1.0
                          total_pages:
                            type: number
                            example: 1.0
        '400':
          description: Failed Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: Couldn't find data with the provided period. Please make
                      sure the provided date is the 1st day of a confirmed month
                  data:
                    type: object
                    nullable: true
                    example: 'null'
  "/openapi/v1/attendance_logs":
    get:
      tags:
      - Attendance Log
      summary: List
      description: |-
        # **Request**

        `GET /openapi/v1/attendance_logs`

        This API endpoint retrieves the status of punches whether it's failed or success .

        The request includes the following:

        ### HEADERS

        | name | **Required** | description | **Type** | **Example** | **default** | **Additional Notes** |
        | --- | --- | --- | --- | --- | --- | --- |
        | api-version | Yes | Supported API version s | Integer | 1 |  | currently supported is 1 only |
        | Slug | Yes | Organization slug name | String | abcd |  |  |
        | Access-Token | Yes | Used to allow an application to access an API it generated from Session API | String | eyJhbGciOiJIUzI1NiJ9.eyJvcmdhbml6YXRpb25faWRlbnRp<br>ZmllciI6OTAwMDAxNCwiYXBpX2tleV9pZCI6MSwic291cm<br>NlIjoib3Blbl9hcGkiLCJzb3VyY2VfaWQiOm51bGwsImlhd<br>CI6MTY5OTYwMjF4NiwiZXhwIjoxNzAyMTk0Njg2fQ.upSy<br>VVcRrBe2SNUvjnAlDq7NO-N_tenPnGF6zNs1KZU |  |  |
        | source | No | the source type of Open Api | String | open_api | open_api | Supported values:  <br>\- open_api  <br>\- external_aggregator |
        | username | Conditional:  <br>if the source type: external_aggregator | the name of the external service | String | workable |  |  |

        #### Query Parameters

        | **name** | **Required** | **Description** | **Type** | **Example** | **Default** | **Additional Notes** |
        | --- | --- | --- | --- | --- | --- | --- |
        | status | Yes | Specifies the type of punches to be retrieved | String | success |  | Currently support only success or failed |
        | limit | No | controll the limit of the shown result per page | Integer | 50 | 100 | Minimum: 1  <br>Maximum: 100 |
        | page | No | choose the required page | Integer | 5 | 1 |  |
        | from | No | choose the start date time | DateTime | 2023-1-1 11:30:00 | 1 hour ago |  |
        | to | No | choose the end date time | DateTime | 2023-10-1 12:30:00 | Current time |  |

        ---

        # Response

        - Success Response

        The success response of the API represented as the following:

        ```
        {
            "success": true,
            "message": null,
            "data": {
                "punches": [
                    {
                        "id": 360257,
                        "punch_time": "2023-11-01T00:00:00.000Z",
                        "employee_code": 199,
                        "terminal_sn": null,
                        "clocking_id": 5467897
                    }
                ],
                "pagination": {
                    "current_page": 1,
                    "next_page": null,
                    "previous_page": null,
                    "total_pages": 1,
                    "per_page": 50,
                    "total_entries": 1
                }
            }
        }

         ```

        This contain the following:

        | **key** | **Description** | **value** |
        | --- | --- | --- |
        | success | represent the status of the API response | true |
        | message | show additional message | null |
        | data | show the required data to fetch, and contain two values type: <br>\+ punches: contain array of all punches details  <br>pagination: contain additional field to navigate data through the api | hash of data |
        | Status_code | the status code of the api request | 200 |

        Leave summary description:

        - `id`: The unique identifier of a punch.
        - `punch_time`: the time when the punch created
        - `terminal_sn`: Unique identifier for punch device.
        - `clocking_id`: Unique The unique identifier of a punch generated by punch mdevice.
        - `manual_balance_adjustment`: The manual adjustment made to the leave balance.

        ---

        Pagination:

        - `current_page`: The current page of the results.
        - `next_page`: The URL of the next page of results, if available.
        - `previous_page`: The URL of the previous page of results, if available.
        - `total_pages`: The total number of pages.
        - `per_page`: The number of results per page.
        - `total_entries`: The total number of entries across all pages.

        ---

        ### Error Response

        The success response of the API represented as the following:

        ```
        {
            "success": false,
            "error": "error message",
            "status_code": 400
        }
         ```

        This response contain the following:

        | **name** | **Description** | **Value** |
        | --- | --- | --- |
        | success | represent the status of the API response | false |
        | error | represent the error reason acquired during the request | error_messages |
        | status_code | the status code of the api requests | error_status_code |

        error_messages

        | **message** | **Reason** |
        | --- | --- |
        | Parameter {field_name} is required | The field name is required |
        | "value" is not a valid {type} | the value passed is not in valid type |
        | invalid api version | invalid `api-version` header passed or api-version header was not passed at all |
        | Organization not found with given subdomain | invalid `Slug` header value |
        | Permission denied. Please contact your Administrator | `Slug` Header is missing or your organization doesn't support open api feature |
        | This call requires login | `Access-Token` is missing or invalid |
        | Your account has been logged out. Please, log in again | previously logged out or expired token |
        | Your account temporary suspended, please contact account manager | The organization account is suspended |
        | Bad credentials | the credentials is not suited on that organization |
        | invalid external aggregator | the aggregator name is not valid within that organization |
        | Unable to authenticate employee | api-key is not active or valid |

        Please note that the values for properties like `id`, `punch_time`, `employee_code`, `terminal_sn`, and `clocking_id` may vary in the actual response and should not be considered as fixed values.
      operationId: list1
      parameters:
      - name: from
        in: query
        schema:
          type: string
      - name: to
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: string
      - name: Slug
        in: header
        schema:
          type: string
      - name: api-version
        in: header
        schema:
          type: string
      - name: Access-Token
        in: header
        schema:
          type: string
      responses:
        '200':
          description: 'Success Punches: Failed Punches'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: number
                            example: 1
                          next_page:
                            type: object
                            nullable: true
                            example: 'null'
                          per_page:
                            type: number
                            example: 50
                          previous_page:
                            type: object
                            nullable: true
                            example: 'null'
                          total_entries:
                            type: number
                            example: 4
                          total_pages:
                            type: number
                            example: 1
                      punches:
                        type: array
                        example:
                        - clocking_id: 5467897
                          employee_code: 199
                          id: 360257
                          punch_time: '2023-11-01T00:00:00.000Z'
                          terminal_sn:
                        - clocking_id: 5467897
                          employee_code: 199
                          id: 360258
                          punch_time: '2023-01-01T11:30:00.000Z'
                          terminal_sn:
                        - clocking_id: 5467897
                          employee_code: 199
                          id: 360259
                          punch_time: '2023-01-01T00:00:00.000Z'
                          terminal_sn:
                        - clocking_id: 5467897
                          employee_code: 199
                          id: 360260
                          punch_time: '2023-01-01T11:30:00.000Z'
                          terminal_sn:
                        items:
                          type: object
                          properties:
                            clocking_id:
                              type: number
                              example: 5467897
                            employee_code:
                              type: number
                              example: 199
                            id:
                              type: number
                              example: 360257
                            punch_time:
                              type: string
                              example: '2023-11-01T00:00:00.000Z'
                            terminal_sn:
                              type: object
                              nullable: true
                              example: 'null'
                  message:
                    type: object
                    nullable: true
                    example: 'null'
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Parameter limit cannot be greater than 100
                  status_code:
                    type: number
                    example: 400
                  success:
                    type: boolean
                    example: false
        '401':
          description: Invalid Slug
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Organization not found with given subdomain
                  success:
                    type: boolean
                    example: false
    post:
      tags:
      - Attendance Log
      summary: Create
      description: |-
        # **Request**

        `POST /openapi/v1/attendance_logs`

        This API endpoint create group of punches

        The request includes the following:

        ### HEADERS

        | name | **Required** | description | **Type** | **Example** | **default** | **Additional Notes** |
        | --- | --- | --- | --- | --- | --- | --- |
        | api-version | Yes | Supported API version s | Integer | 1 |  | currently supported is 1 only |
        | Slug | Yes | Organization slug name | String | abcd |  |  |
        | Access-Token | Yes | Used to allow an application to access an API it generated from Session API | String | eyJhbGciOiJIUzI1NiJ9.eyJvcmdhbml6YXRpb25faWRlbnRp<br>ZmllciI6OTAwMDAxNCwiYXBpX2tleV9pZCI6MSwic291cm<br>NlIjoib3Blbl9hcGkiLCJzb3VyY2VfaWQiOm51bGwsImlhd<br>CI6MTY5OTYwMjF4NiwiZXhwIjoxNzAyMTk0Njg2fQ.upSy<br>VVcRrBe2SNUvjnAlDq7NO-N_tenPnGF6zNs1KZU |  |  |
        | source | No | the source type of Open Api | String | open_api | open_api | Supported values:  <br>\- open_api  <br>\- external_aggregator |
        | username | Conditional:  <br>if the source type: external_aggregator | the name of the external service | String | workable |  |  |

        #### Query Parameters

        | **name** | **Required** | **Description** | **Type** | **Additional Notes** |
        | --- | --- | --- | --- | --- |
        | data | Yes | contain array of punches params | Array | \+ Currently support only success |

        Punch Params:

        | Name | **Required** | Description | **Type** | **Additional Notes** |
        | --- | --- | --- | --- | --- |
        | terminal_sn | Yes | Unique identifier for punch device | String | \+ organization may have multiple punch devices |
        | punch_time | Yes | The time were punch created | DateTime |  |
        | id | Yes | Unique identifier for each punch generated by punch device | Integer |  |
        | emp_code | Yes | code number for the employee who whom the punch come from | Integer |  |

        # Response

        - Success Response

        The success response of the API represented as the following:

        ```
        {
            "success": true,
            "message": "Creating punches on processing",
            "data": null
        }

         ```

        This contain the following:

        | **key** | **Description** | **value** |
        | --- | --- | --- |
        | success | represent the status of the API response | true |
        | message | show additional message | null |
        | data | null |  |

        ---

        ### Error Response

        The success response of the API represented as the following:

        ```
        {
            "success": false,
            "error": "Number of punches exceeds allowed limit: 100",
            "data": null
        }
         ```

        This response contain the following:

        | **name** | **Description** | **Value** |
        | --- | --- | --- |
        | success | represent the status of the API response | false |
        | error | represent the error reason acquired during the request | error_messages |
        | status_code | the status code of the api requests | error_status_code |

        error_messages

        | **message** | **Reason** |
        | --- | --- |
        | Number of punches exceeds allowed limit: 100 | Number of punches sent with the request has exceeded the maximum |
        |  | The field name is required |
        | "value" is not a valid {type} | the value passed is not in valid type |
        | invalid api version | invalid `api-version` header passed or api-version header was not passed at all |
        | Organization not found with given subdomain | invalid `Slug` header value |
        | Permission denied. Please contact your Administrator | `Slug` Header is missing or your organization doesn't support open api feature |
        | This call requires login | `Access-Token` is missing or invalid |
        | Your account has been logged out. Please, log in again | previously logged out or expired token |
        | Your account temporary suspended, please contact account manager | The organization account is suspended |
        | Bad credentials | the credentials is not suited on that organization |
        | invalid external aggregator | the aggregator name is not valid within that organization |
        | Unable to authenticate employee | api-key is not active or valid |
      operationId: create1
      parameters:
      - name: Slug
        in: header
        schema:
          type: string
      - name: api-version
        in: header
        schema:
          type: string
      - name: Access-Token
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  example:
                  - emp_code: 199
                    id: 5467897
                    punch_time: '2023-1-1 11:30:00'
                    terminal_sn: '1'
                  items:
                    type: object
                    properties:
                      emp_code:
                        type: number
                        example: 199
                      id:
                        type: number
                        example: 5467897
                      punch_time:
                        type: string
                        example: '2023-1-1 11:30:00'
                      terminal_sn:
                        type: string
                        example: '1'
        required: false
      responses:
        '201':
          description: Create Punches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                    example: 'null'
                  message:
                    type: string
                    example: Creating punches on processing
                  success:
                    type: boolean
                    example: true
        '400':
          description: Exceed Limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    nullable: true
                    example: 'null'
                  error:
                    type: string
                    example: 'Number of punches exceeds allowed limit: 100'
                  success:
                    type: boolean
                    example: false
        '401':
          description: Invalid Slug
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Organization not found with given subdomain
                  success:
                    type: boolean
                    example: false
  "/openapi/v1/attendance/summary":
    get:
      tags:
      - Attendance
      summary: Summary
      description: |-
        # **Request**

        `GET /openapi/v1/attendance/summary`

        This endpoint retrieves the attendance summary for employees within a specified date range default is current month. The request have ability to filter by employee ID, status, from date, to date, page, and (rpp) results per page

        The request includes the following:

        ### HEADERS

        | name | **Required** | description | **Type** | **Example** | **default** | **Additional Notes** |
        | --- | --- | --- | --- | --- | --- | --- |
        | api-version | Yes | Supported API version s | Integer | 1 |  | currently supported is 1 only |
        | Slug | Yes | Organization slug name | String | abcd |  |  |
        | Access-Token | Yes | Used to allow an application to access an API it generated from Session API | String | eyJhbGciOiJIUzI1NiJ9.eyJvcmdhbml6YXRpb25faWRlbnRp<br>ZmllciI6OTAwMDAxNCwiYXBpX2tleV9pZCI6MSwic291cm<br>NlIjoib3Blbl9hcGkiLCJzb3VyY2VfaWQiOm51bGwsImlhd<br>CI6MTY5OTYwMjF4NiwiZXhwIjoxNzAyMTk0Njg2fQ.upSy<br>VVcRrBe2SNUvjnAlDq7NO-N_tenPnGF6zNs1KZU |  |  |
