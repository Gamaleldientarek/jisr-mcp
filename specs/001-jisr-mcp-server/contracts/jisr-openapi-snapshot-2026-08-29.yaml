  "/openapi/v1/audit_events":
    get:
      tags:
      - Audit Event
      summary: List Audit Events
      description: |-
        # **Request**

        `GET /openapi/v1/audit_events`

        This API endpoint retrieves a paginated list of audit events.

        ### HEADERS

        | name         | **Required** | description                                 | **Type** | **Example** | **Additional Notes** |
        |--------------|--------------|---------------------------------------------|-----------|-------------|---------------------|
        | api-version  | Yes          | Supported API version                       | Integer   | 1           | Only 1 is supported |
        | Slug         | Yes          | Organization slug name                      | String    | abcd        |                     |
        | Access-Token | Yes          | JWT for authentication                      | String    | ...         |                     |

        ### Query Parameters

        | name                | **Required** | Description                                 | **Type**           | **Example**                        | **Notes**  |
        |---------------------|--------------|---------------------------------------------|--------------------|------------------------------------|------------|
        | filter[module_name] | No           | Filter by module name                       | Array              | filter[module_name]['security']    |            |
        | filter[event_name]  | No           | Filter by event name                        | Array              | filter[event_name]['login']        |            |
        | filter[event_type]  | No           | Filter by event type                        | Array              | filter[event_type]['updated']      |            |
        | filter[from_date]   | No           | Filter by created_at >= from (ISO8601)      | String (date-time) | 2025-09-01T00:00:00Z               |            |
        | filter[to_date]     | No           | Filter by created_at <= to (ISO8601)        | String (date-time) | 2025-09-10T23:59:59Z               |            |
        | page                | No           | Page number for pagination                  | Integer            | 1                                  |            |
        | per_page            | No           | Number of items per page                    | Integer            | 20                                 |            |

        ---

        # Response

        - Success Response Example

        ```json
        {
          "success": true,
          "message": null,
          "data": {
            "audit_events": [
              {
                "id": 123,
                "module_name_i18n": "Security",
                "feature_name_i18n": "Role",
                "action_name_i18n": "Updated",
                "actor": {
                  "id": 456,
                  "full_name_i18n": "John Doe"
                },
                "success": true,
                "created_at": "2025-09-09T12:34:56Z"
              }
            ],
            "pagination": {
              "current_page": 1,
              "next_page": null,
              "previous_page": null,
              "total_pages": 1,
              "total_count": 1
            }
          }
        }
        ```
      parameters:
      - in: query
        name: filter[module_name]
        style: deepObject
        explode: true
        schema:
          type: array
          items:
            type: string
            example: security
        description: Filter by module name (e.g. `filter[module_name]['security']`).
      - in: query
        name: filter[event_name]
        style: deepObject
        explode: true
        schema:
          type: array
          items:
            type: string
            example: login
        description: Filter by event name (e.g. `filter[event_name]['login']`).
      - in: query
        name: filter[event_type]
        style: deepObject
        explode: true
        schema:
          type: array
          items:
            type: string
            example: updated
        description: Filter by event type (e.g. `filter[event_type]['updated']`).
      - in: query
        name: filter[from_date]
        schema:
          type: string
          example: '2025-09-01T00:00:00Z'
        description: Filter by created_at >= from (ISO8601).
      - in: query
        name: filter[to_date]
        schema:
          type: string
          example: '2025-09-10T23:59:59Z'
        description: Filter by created_at <= to (ISO8601).
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: Page number for pagination.
      - in: query
        name: per_page
        schema:
          type: integer
          default: 20
        description: Number of items per page.
      responses:
        '200':
          description: A list of audit events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    nullable: true
                  data:
                    type: object
                    properties:
                      audit_events:
                        type: array
                        items:
                          "$ref": "#/components/schemas/AuditEvent"
                      pagination:
                        "$ref": "#/components/schemas/Pagination"
        '401':
          description: Unauthorized
        '500':
          description: Server error
